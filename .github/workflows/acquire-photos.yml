name: Acquire licensed portfolio photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_photos.py
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/fetch_photos.py
      - name: Commit optimized local reference assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/*.webp assets/social/og-cover.jpg
          git diff --cached --quiet && exit 0
          git commit -m "assets: add optimized licensed spa reference photos"
          git push origin HEAD:main
